<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta-Product Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1>Meta-Product Manager</h1>
      <span class="badge">Prototype v0.3</span>
    </div>
    <div class="header-right">
      <button id="btn-create-meta" class="btn btn-primary">+ Create Meta Product</button>
    </div>
  </header>

  <!-- Summary Info Bar -->
  <section class="meta-summary-bar">
    <div class="summary-item">
      <span class="summary-label">Meta-Product Name</span>
      <span id="meta-name" class="summary-value">Smart Watch Platform</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Product Line</span>
      <span id="meta-line" class="summary-value">Wearables Series X</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Creator</span>
      <span id="meta-creator" class="summary-value">Alex Rivera</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Last Editor</span>
      <span id="meta-editor" class="summary-value">Jordan Lee</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Last Modified</span>
      <span id="meta-date" class="summary-value">2026-10-13</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Active Modules</span>
      <span id="meta-count" class="summary-value">0</span>
    </div>
    <div class="summary-action">
      <button id="btn-edit-details" class="btn btn-secondary btn-sm">Edit Meta Details</button>
    </div>
  </section>

  <div class="app-container">
    <aside class="sidebar">
      <h2>Structure & Options</h2>
      <div id="controls-container"></div>
    </aside>

    <main class="canvas-area">
      <div id="viewport" class="viewport">
        <svg id="svg-connectors" class="svg-connectors"></svg>
        <div id="tree-canvas" class="tree-canvas"></div>
      </div>
    </main>
  </div>

  <!-- Modal for Creating New Meta Product -->
  <div id="modal-create" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Create New Meta-Product</h3>
        <button id="btn-close-modal" class="btn-close">&times;</button>
      </div>
      <form id="form-create-meta">
        <div class="form-group">
          <label for="input-name">Meta-Product Name *</label>
          <input type="text" id="input-name" required placeholder="e.g. NextGen Industrial Sensor" />
        </div>
        <div class="form-group">
          <label for="input-line">Product Line / Family</label>
          <input type="text" id="input-line" placeholder="e.g. IoT Edge Solutions" />
        </div>
        <div class="form-group">
          <label for="input-creator">Creator Name</label>
          <input type="text" id="input-creator" value="Alex Rivera" />
        </div>
        <div class="modal-footer">
          <button type="button" id="btn-cancel-modal" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Create & Edit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

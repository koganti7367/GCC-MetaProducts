<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta-Product Modeling Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Meta-Product Visualizer</h1>
    <span class="badge">Prototype v0.1</span>
  </header>

  <div class="app-container">
    <!-- Sidebar for controls, configuration, and options -->
    <aside class="sidebar">
      <h2>Product Options</h2>
      <div id="controls-container">
        <p class="placeholder-text">Options and choices will appear here...</p>
      </div>
    </aside>

    <!-- Main stage for visual product modeling -->
    <main class="canvas-area">
      <div id="viewport" class="viewport">
        <div class="placeholder-text">
          <h3>Product Visualization Canvas</h3>
          <p>Ready to build structure view.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
